<!DOCTYPE html>
<html>
<head>
    <title>three.js css3d - periodic table</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <meta property="og:title" content="three.js css3d - periodic table">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://threejs.org/examples/css3d_periodictable.html">
    <meta property="og:image" content="https://threejs.org/examples/screenshots/css3d_periodictable.jpg">
    <link type="text/css" rel="stylesheet" href="./styles/main.css" />
    <link type="text/css" rel="stylesheet" href="./styles/style.css" />
</head>
<body>
<div id="info"><a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> css3d - periodic table.</div>
<div id="container"></div>
<div id="menu">
    <button id="table">TABLE</button>
    <button id="sphere">SPHERE</button>
    <button id="helix">HELIX</button>
    <button id="grid">GRID</button>
</div>

<script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
      }
    }
</script>

<script type="module">
  import * as THREE from 'three';
  import { TrackballControls } from 'three/addons/controls/TrackballControls.js';
  import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

  import data from './data.js';
  import { transform, onWindowResize, animate, render } from './utils.js';

  console.log(`共有 ${data.length} 个元素.`);

  let camera, scene, renderer;
  let controls;

  const objects = [];
  const targets = {table: [], sphere: [], helix: [], grid: []};

  // 1. 搞一个全局开关
  const isAutoSpinning = { value: false };

  init();
  animate(controls, isAutoSpinning, renderer, scene, camera);

  function init() {
    camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 10000);
    camera.position.z = 3000;

    scene = new THREE.Scene();

    const vector = new THREE.Vector3();

    const length = data.length;

    for (let i = 0; i < length; i += 1) {
      // table
      (() => {
        const element = document.createElement('div');
        element.className = 'element';
        element.style.backgroundColor = 'rgba(0,127,127,' + (Math.random() * 0.5 + 0.25) + ')';

        const member = data[i];

        const number = document.createElement('div');
        number.className = 'number';
        number.textContent = member.employeeId;
        element.appendChild(number);

        const symbol = document.createElement('div');
        symbol.className = 'symbol';
        symbol.textContent = member.name;
        element.appendChild(symbol);

        const details = document.createElement('div');
        details.className = 'details';
        details.innerHTML = member.department;
        element.appendChild(details);

        const objectCSS = new CSS3DObject(element);
        objectCSS.position.x = Math.random() * 4000 - 2000;
        objectCSS.position.y = Math.random() * 4000 - 2000;
        objectCSS.position.z = Math.random() * 4000 - 2000;
        scene.add(objectCSS);

        objects.push(objectCSS);

        const object = new THREE.Object3D();
        object.position.x = ((i % 18) * 140) - 1330;
        object.position.y = -(Math.ceil((i + 1) / 18) * 180) + 990;

        targets.table.push(object);
      })();

      // sphere
      (() => {
        const phi = Math.acos(-1 + (2 * i) / length);
        const theta = Math.sqrt(length * Math.PI) * phi;

        const object = new THREE.Object3D();

        object.position.setFromSphericalCoords(800, phi, theta);

        vector.copy(object.position).multiplyScalar(2);

        object.lookAt(vector);

        targets.sphere.push(object);
      })();

      // helix
      (() => {
        const theta = i * 0.175 + Math.PI;
        const y = -(i * 8) + 450;

        const object = new THREE.Object3D();

        object.position.setFromCylindricalCoords(900, theta, y);

        vector.x = object.position.x * 2;
        vector.y = object.position.y;
        vector.z = object.position.z * 2;

        object.lookAt(vector);

        targets.helix.push(object);
      })();

      // grid
      (() => {
        const object = new THREE.Object3D();

        object.position.x = ((i % 5) * 400) - 800;
        object.position.y = (-(Math.floor(i / 5) % 5) * 400) + 800;
        object.position.z = (Math.floor(i / 25)) * 1000 - 2000;

        targets.grid.push(object);
      })();
    }

    renderer = new CSS3DRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('container').appendChild(renderer.domElement);

    controls = new TrackballControls(camera, renderer.domElement);
    controls.minDistance = 500;
    controls.maxDistance = 6000;
    controls.addEventListener('change', () => render(renderer, scene, camera));

    const buttonTable = document.getElementById('table');
    buttonTable.addEventListener('click', function () {
      // 切回表格时，一键关闭自转，重置角度
      isAutoSpinning.value = false;
      scene.rotation.y = 0;
      transform(objects, targets.table, 1000, renderer, scene, camera);
    });

    const buttonSphere = document.getElementById('sphere');
    buttonSphere.addEventListener('click', async () => {
      await transform(objects, targets.sphere, 1000, renderer, scene, camera);

      // 卡片全部落地了！一键开启永恒自转
      isAutoSpinning.value = true;
    });

    const buttonHelix = document.getElementById('helix');
    buttonHelix.addEventListener('click', function () {
      // 切回表格时，一键关闭自转，重置角度
      isAutoSpinning.value = false;
      scene.rotation.y = 0;
      transform(objects, targets.helix, 1000, renderer, scene, camera);
    });

    const buttonGrid = document.getElementById('grid');
    buttonGrid.addEventListener('click', function () {
      // 切回表格时，一键关闭自转，重置角度
      isAutoSpinning.value = false;
      scene.rotation.y = 0;
      transform(objects, targets.grid, 1000, renderer, scene, camera);
    });

    transform(objects, targets.table, 1000, renderer, scene, camera);

    window.addEventListener('resize', () => onWindowResize(renderer, scene, camera));
  }
</script>
</body>
</html>
