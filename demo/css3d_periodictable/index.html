<!DOCTYPE html>
<html>
<head>
    <title>three.js css3d - periodic table</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <meta property="og:title" content="three.js css3d - periodic table">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://threejs.org/examples/css3d_periodictable.html">
    <meta property="og:image" content="https://threejs.org/examples/screenshots/css3d_periodictable.jpg">
    <link type="text/css" rel="stylesheet" href="./styles/main.css" />
    <link type="text/css" rel="stylesheet" href="./styles/style.css" />
</head>
<body>
<div id="info"><a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> css3d - periodic table.</div>
<div id="container"></div>
<div id="menu">
    <button id="table">TABLE</button>
    <button id="sphere">SPHERE</button>
    <button id="helix">HELIX</button>
    <button id="grid">GRID</button>
    <button id="lottery">Lottery</button>
    <button id="finish">Finish</button>
</div>

<div style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 6px; height: 6px; border-radius: 50%; background-color: #88ffff;"></div>

<script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
      }
    }
</script>

<script type="module">
  import * as THREE from 'three';
  import TWEEN from 'three/addons/libs/tween.module.js';
  import { TrackballControls } from 'three/addons/controls/TrackballControls.js';
  import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

  import data from './data.js';
  import { transform, rotating, calcWinnerCoord, handleWindowResize, animate, render, calcLayout } from './utils';

  console.log(`共有 ${data.length} 个元素.`);

  let camera, scene, renderer;
  let controls;

  const objects = [];
  const targets = {table: [], sphere: [], helix: [], grid: []};

  init();
  animate(controls, renderer, scene, camera);

  function init() {
    camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 10000);
    camera.position.z = 3000;

    scene = new THREE.Scene();

    const vector = new THREE.Vector3();

    const length = data.length;

    // 一键获取智能计算的结果.
    const gapX = 140;
    const gapY = 180;
    const { col, offsetX, offsetY } = calcLayout(length, gapX, gapY);

    for (let i = 0; i < length; i += 1) {
      // table
      (() => {
        const element = document.createElement('div');
        element.className = 'element';
        element.style.backgroundColor = 'rgba(0,127,127,' + (Math.random() * 0.5 + 0.25) + ')';

        const member = data[i];

        const number = document.createElement('div');
        number.className = 'number';
        number.textContent = member.employeeId;
        element.appendChild(number);

        const symbol = document.createElement('div');
        symbol.className = 'symbol';
        symbol.textContent = member.name;
        element.appendChild(symbol);

        const details = document.createElement('div');
        details.className = 'details';
        details.innerHTML = member.department;
        element.appendChild(details);

        const objectCSS = new CSS3DObject(element);
        objectCSS.position.x = Math.random() * 4000 - 2000;
        objectCSS.position.y = Math.random() * 4000 - 2000;
        objectCSS.position.z = Math.random() * 4000 - 2000;
        scene.add(objectCSS);
        objects.push(objectCSS);

        const object = new THREE.Object3D();
        // 动态居中.
        object.position.x = ((i % col) * gapX) + offsetX;
        object.position.y = -(Math.floor(i / col) * gapY) + offsetY; // 3D里第一行在最上面，所以用负号往下排

        targets.table.push(object);
      })();

      // sphere
      (() => {
        const phi = Math.acos(-1 + (2 * i) / length);
        const theta = Math.sqrt(length * Math.PI) * phi;

        const object = new THREE.Object3D();

        object.position.setFromSphericalCoords(800, phi, theta);

        vector.copy(object.position).multiplyScalar(2);

        object.lookAt(vector);

        targets.sphere.push(object);
      })();

      // helix
      (() => {
        const theta = i * 0.175 + Math.PI;
        const y = -(i * 8) + 450;

        const object = new THREE.Object3D();

        object.position.setFromCylindricalCoords(900, theta, y);

        vector.x = object.position.x * 2;
        vector.y = object.position.y;
        vector.z = object.position.z * 2;

        object.lookAt(vector);

        targets.helix.push(object);
      })();

      // grid
      (() => {
        const object = new THREE.Object3D();

        object.position.x = ((i % 5) * 400) - 800;
        object.position.y = (-(Math.floor(i / 5) % 5) * 400) + 800;
        object.position.z = (Math.floor(i / 25)) * 1000 - 2000;

        targets.grid.push(object);
      })();
    }

    renderer = new CSS3DRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('container').appendChild(renderer.domElement);

    controls = new TrackballControls(camera, renderer.domElement);
    controls.minDistance = 500;
    controls.maxDistance = 6000;
    controls.addEventListener('change', () => render(renderer, scene, camera));

    const buttonTable = document.getElementById('table');
    buttonTable.addEventListener('click', async () => {
      await Promise.all([
        transform(objects, targets.table, 1000),
        rotating(scene, 0, 500),
      ]);
    });

    const buttonSphere = document.getElementById('sphere');
    buttonSphere.addEventListener('click', async () => {
      await Promise.all([
        transform(objects, targets.sphere, 1000),
        rotating(scene, 0, 500),
      ]);

      // 落地瞬间，无缝衔接：让它开启“伪无限”的慢速自转
      // 转 1000 圈，耗时 50000 秒（大概 833.33 分钟，足够年会背景用了）
      rotating(scene, Math.PI * 2 * 1000, 50000000);
    });

    const buttonHelix = document.getElementById('helix');
    buttonHelix.addEventListener('click', async () => {
      await Promise.all([
        transform(objects, targets.helix, 1000),
        rotating(scene, 0, 500),
      ]);
    });

    const buttonGrid = document.getElementById('grid');
    buttonGrid.addEventListener('click', async () => {
      await Promise.all([
        transform(objects, targets.grid, 1000),
        rotating(scene, 0, 500),
      ]);
    });

    const buttonLottery = document.getElementById('lottery');
    buttonLottery.addEventListener('click', async () => {
      // 1. ⚡ 【第一阶段：狂暴冲刺】
      // 2秒钟疯狂空转 40 圈，用 Linear（匀速）或者 Exponential.In（指数加速）
      const startY = scene.rotation.y;
      const fastTargetY = startY + (Math.PI * 2 * 1000);
      await rotating(scene, fastTargetY, 500000, TWEEN.Easing.Linear.None);
    });

    const buttonFinish = document.getElementById('finish');
    buttonFinish.addEventListener('click', async () => {
      // 2. 🛑 【第二阶段：灵魂减速刹车】（这就是你要的渐渐停止效果）
      // 重点：我们再往前加 5 圈（给足刹车缓冲距离），但是耗时拉长到 3.5 秒！
      // 并且使用顶级的 Cubic.Out（由快到慢的优雅减速曲线）
      const currentY = scene.rotation.y;
      const stopTargetY = currentY + (Math.PI * 2 * 5);

      console.log("🔔 触动刹车！正在缓缓减速定格...");
      await rotating(scene, stopTargetY, 3500, TWEEN.Easing.Cubic.Out);

      const { xTable, yTable, scale } = calcWinnerCoord(
        1,
        { width: 120, height: 160 },
        { width: window.innerWidth, height: window.innerHeight },
        0
      );

      const winner = objects[0];

      new TWEEN.Tween(winner.position)
        .to({ x: xTable, y: yTable, z: 1000 }, 2200)
        .easing(TWEEN.Easing.Exponential.InOut)
        .onStart(() => {
          // const ele = winner.element;
          // ele.style.transform = `scale(5)`;

          // winner.element = ele;
        })
        .start()
        .onComplete(() => {});

      new TWEEN.Tween(winner.rotation)
        .to({ x: 0, y: 0, z: 0 }, 900)
        .easing(TWEEN.Easing.Exponential.InOut)
        .start()
        .onComplete(() => {});
    });

    transform(objects, targets.table, 1000);

    window.addEventListener('resize', () => handleWindowResize(renderer, scene, camera));
  }
</script>
</body>
</html>
