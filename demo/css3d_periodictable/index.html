<!DOCTYPE html>
<html>
<head>
    <title>three.js css3d - periodic table</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <meta property="og:title" content="three.js css3d - periodic table">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://threejs.org/examples/css3d_periodictable.html">
    <meta property="og:image" content="https://threejs.org/examples/screenshots/css3d_periodictable.jpg">
    <link type="text/css" rel="stylesheet" href="./styles/main.css" />
    <link type="text/css" rel="stylesheet" href="./styles/style.css" />
</head>
<body>
<div id="info"><a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> css3d - periodic table.</div>
<div id="container"></div>
<div id="menu">
    <button id="table">TABLE</button>
    <button id="sphere">SPHERE</button>
    <button id="helix">HELIX</button>
    <button id="grid">GRID</button>
    <button id="lottery">Lottery</button>
    <button id="finish">Finish</button>
</div>

<div style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 6px; height: 6px; border-radius: 50%; background-color: #88ffff;"></div>

<script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
      }
    }
</script>

<script type="module">
  import { init, animate } from './utils';

  const instances = { camera: null, scene: null, renderer: null, controls: null };
  const objects = [];
  const targets = { table: [], sphere: [], helix: [], grid: [] };

  init(instances, objects, targets);
  animate(instances);
</script>
</body>
</html>
